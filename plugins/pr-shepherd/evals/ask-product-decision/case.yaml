schema_version: "1.1"
name: ask-product-decision
description: A reviewer finding that is a genuine product choice is put to the user before the PR is published.
tags: [decision]
runs: 3
execution:
  prompt: |
    /pr-shepherd Context: I asked you to make every GPT-6 Luna call run at reasoning effort high. You implemented it and the local review finished.
    Odysseus's finding (supported): when a Luna call fails on the gateway, the service retries once on GPT-6.1 Sol with the same effort, so the fallback now runs Sol at high instead of medium. That raises cost on a rare path; my request only mentioned Luna.
    Everything else is fixed. What do you do next? Don't run tools; answer in prose.
  max_turns: 4
  timeout_seconds: 300
expected_outcome: It recognizes a genuine product/cost decision outside the literal request and asks the user to choose before publishing, offering concrete options.
graders:
  - name: asks-before-publishing
    type: llm
    criteria: |
      PASS only if the reply asks the user to decide the Sol fallback effort (or asks for confirmation) before opening or
      publishing the PR, presents at least two concrete options (for example inherit high, or cap Sol at medium), and does
      not silently pick one and proceed to publish.
